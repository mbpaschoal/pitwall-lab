name: Produto e idiomas / Product and languages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependências de apresentação / Presentation dependencies
        run: python -m pip install -r publicacao/templates/requirements.txt
      - name: Versão e documentação / Version and documentation
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m pitwall.publishing.releases check
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            python -m pitwall.publishing.releases check --base "$BASE_REF"
          fi
      - name: Testes PT e EN / PT and EN tests
        # Post-race admission is checked separately from frozen scientific tests.
        run: |
          python -B -m unittest tests.test_automatic_publication tests.test_final_results tests.test_posterior_binding tests.test_mexico_evaluation_ui tests.test_pneus_apresentacao
          python -B -m unittest tests.test_interface_link_context tests.test_public_navigation
          python -B -m unittest tests.test_i18n tests.test_releases tests.test_dashboard_app tests.test_dashboard_acervo_app tests.test_interface_editorial tests.test_driver_conditions tests.test_driver_projection tests.test_pilot_views tests.test_race_weather tests.test_tyre_reconciliation tests.test_tyre_age tests.test_driver_source_audit tests.test_review_regressions tests.test_fan_exploration tests.test_weekend_operation tests.test_weekend_reconciliation tests.test_weekend_official tests.test_weekend_ui tests.test_weekend_cloud tests.test_fan_journey tests.test_fan_composition tests.test_tarot_catalog tests.test_high_resolution_assets tests.test_exportar_catalogo tests.test_verificar_pacote tests.test_uiux_profiles tests.test_uiux_races tests.test_uiux_method tests.test_uiux_media
      - name: Integridade do pacote publicado / Published package integrity
        run: |
          python -B exportar_dashboard.py --destino "$RUNNER_TEMP/expected-package/pitwall-dashboard"
          diff -qr --exclude=__pycache__ "$RUNNER_TEMP/expected-package/pitwall-dashboard" "$GITHUB_WORKSPACE/distribuicao/pitwall-dashboard"
          python -B verificar_pacote.py --pacote "$GITHUB_WORKSPACE/distribuicao/pitwall-dashboard"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r publicacao/templates/requirements.txt
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Jornadas de fãs / Fan journeys
        run: |
          export PITWALL_EXPECTED_VERSION="$(cat VERSION)"
          export PITWALL_SOURCE_ROOT="$GITHUB_WORKSPACE/distribuicao/pitwall-dashboard"
          python -m streamlit run distribuicao/pitwall-dashboard/app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > "$RUNNER_TEMP/streamlit.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 1
          done
          node tests/browser/aceite_exploracao.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/browser-evidence"
          node tests/browser/aceite_visual.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/visual-evidence"
          node tests/browser/aceite_controles.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/controls-evidence"
          node tests/browser/aceite_rolagem.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/scroll-evidence"
          node tests/browser/aceite_fim_semana.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/weekend-evidence"
          node tests/browser/aceite_contexto.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/context-evidence"
          PLAYWRIGHT_BROWSER=webkit node tests/browser/aceite_rolagem.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/scroll-webkit-evidence"
          PLAYWRIGHT_BROWSER=webkit node tests/browser/aceite_contexto.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/context-webkit-evidence"
          PLAYWRIGHT_BROWSER=webkit node tests/browser/aceite_controles.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/controls-webkit-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fan-journey-evidence
          retention-days: 3
          path: |
            ${{ runner.temp }}/browser-evidence
            ${{ runner.temp }}/visual-evidence
            ${{ runner.temp }}/controls-evidence
            ${{ runner.temp }}/controls-webkit-evidence
            ${{ runner.temp }}/scroll-evidence
            ${{ runner.temp }}/weekend-evidence
            ${{ runner.temp }}/context-evidence
            ${{ runner.temp }}/scroll-webkit-evidence
            ${{ runner.temp }}/context-webkit-evidence
            ${{ runner.temp }}/streamlit.log
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pacote da release / Release package
        run: python exportar_dashboard.py --destino "$RUNNER_TEMP/pitwall-release/pitwall-dashboard"
      - name: Notas PT e EN / PT and EN release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pitwall.publishing.releases publish --asset "$RUNNER_TEMP/pitwall-release/pitwall-dashboard.zip"
