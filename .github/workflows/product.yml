name: Produto e idiomas / Product and languages
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
  n8n-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Auditar lockfile n8n / Audit n8n lockfile
        run: |
          python - "$RUNNER_TEMP/n8n-audit.json" <<'PYCODE'
          import subprocess,sys
          with open(sys.argv[1],'w') as output:
              result=subprocess.run(['npx','--yes','pnpm@11.25.0','--dir','automation/n8n','audit','--prod','--json'],stdout=output)
          if result.returncode not in (0,1): raise SystemExit(result.returncode)
          PYCODE
          python -B automation/n8n/audit_result.py "$RUNNER_TEMP/n8n-audit.json" "$RUNNER_TEMP/n8n-policy.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: n8n-dependency-audit
          retention-days: 30
          path: |
            ${{ runner.temp }}/n8n-audit.json
            ${{ runner.temp }}/n8n-policy.json
  research-tests:
    name: Oráculos sintéticos de pesquisa / Synthetic research oracles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_statsmodels_audit.txt
      - name: Validar fixtures sem executar experimentos reais / Validate fixtures without real experiments
        run: python -B -m unittest tests.test_calibration_v2 tests.test_statsmodels_audit tests.test_qualifying_gaps tests.test_qualifying_gaps_miami tests.test_robust_qualifying tests.test_metodologia_v2 tests.test_diagnosticos_v2
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Dependências de apresentação / Presentation dependencies
        run: python -m pip install -r publicacao/templates/requirements.txt -r requirements_modelo_v1.txt
      - name: Versão e documentação / Version and documentation
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m pitwall.publishing.releases check
          validation_base="$BASE_REF"
          case "$GITHUB_REF" in
            refs/heads/codex/*) validation_base="$(git merge-base HEAD origin/main)" ;;
          esac
          if [ -n "$validation_base" ] && git cat-file -e "$validation_base^{commit}" 2>/dev/null; then
            python -m pitwall.publishing.releases check --base "$validation_base"
          fi
      - name: Testes PT e EN / PT and EN tests
        # Post-race admission is checked separately from frozen scientific tests.
        run: |
          python -B -m unittest tests.test_acervo_dashboard_dados -v
          python -B -m unittest discover -s reports/prospectivo_p1_20261105 -p 'test_*.py' -v
          python -B -m unittest tests.test_prospective_automation tests.test_supervision -v
          python -B -m unittest tests.test_complementary_sources tests.test_identity_revision
          python -B -m unittest tests.test_review_readers tests.test_standings_publication tests.test_contexto_editorial tests.test_catalogo_visual tests.test_capturar_fontes_pendencias tests.test_visual_collection
          python -B -m unittest tests.test_post_qualifying tests.test_github_maintenance tests.test_weekend_readiness tests.test_automatic_publication tests.test_final_results tests.test_posterior_binding tests.test_mexico_evaluation_ui tests.test_pneus_apresentacao
          python -B -m unittest tests.test_operacao_2026_fluxo tests.test_operacao_2026_integracao tests.test_registro_emissoes
          python -B -m unittest tests.test_interface_link_context tests.test_public_navigation
          python -B -m unittest tests.test_i18n tests.test_releases tests.test_dashboard_app tests.test_dashboard_acervo_app tests.test_interface_editorial tests.test_driver_conditions tests.test_driver_updates tests.test_driver_projection tests.test_pilot_views tests.test_race_weather tests.test_tyre_reconciliation tests.test_tyre_age tests.test_driver_source_audit tests.test_review_regressions tests.test_fan_exploration tests.test_weekend_operation tests.test_weekend_reconciliation tests.test_weekend_official tests.test_weekend_ui tests.test_weekend_cloud tests.test_fan_journey tests.test_fan_composition tests.test_tarot_catalog tests.test_high_resolution_assets tests.test_exportar_catalogo tests.test_verificar_pacote tests.test_uiux_profiles tests.test_uiux_races tests.test_uiux_method tests.test_uiux_media
      - name: Integridade do pacote publicado / Published package integrity
        run: |
          python -B exportar_dashboard.py --destino "$RUNNER_TEMP/expected-package/pitwall-dashboard"
          diff -qr --exclude=__pycache__ "$RUNNER_TEMP/expected-package/pitwall-dashboard" "$GITHUB_WORKSPACE/distribuicao/pitwall-dashboard"
          python -B verificar_pacote.py --pacote "$GITHUB_WORKSPACE/distribuicao/pitwall-dashboard"
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, navigation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r publicacao/templates/requirements.txt
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Jornadas de fãs / Fan journeys
        env:
          PITWALL_BROWSER_SUITE: ${{ matrix.suite }}
        run: |
          export PITWALL_EXPECTED_VERSION="$(cat VERSION)"
          export PITWALL_SOURCE_ROOT="$GITHUB_WORKSPACE/distribuicao/pitwall-dashboard"
          python -m streamlit run distribuicao/pitwall-dashboard/app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > "$RUNNER_TEMP/streamlit.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 1
          done
          if [ "$PITWALL_BROWSER_SUITE" = "core" ]; then
            node --test tests/browser/test_verificar_p1.cjs
            node tests/browser/aceite_editorial.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/editorial-evidence"
            node --test tests/browser/test_verificar_publicacao.cjs
            node tests/browser/aceite_resiliencia.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/resilience-evidence"
            node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync("distribuicao/pitwall-dashboard/frontend_assets/operacao_fim_semana.json"));fs.writeFileSync(process.env.RUNNER_TEMP+"/publication-input.json",JSON.stringify({identidade:[s.temporada,s.rodada,s.circuito_id]}));'
            PITWALL_PUBLIC_BASE_URL=http://127.0.0.1:8501 node tests/browser/verificar_publicacao.cjs "$(cat VERSION)" "$RUNNER_TEMP/publication-input.json" "$RUNNER_TEMP/publication-rehearsal"
            node tests/browser/aceite_exploracao.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/browser-evidence"
            node tests/browser/aceite_pilotos_atualizacao.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/driver-updates-evidence"
            node tests/browser/aceite_visual.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/visual-evidence"
            node tests/browser/aceite_fim_semana.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/weekend-evidence"
            node tests/browser/aceite_pneus_lawson.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/lawson-tyres-evidence"
            node tests/browser/aceite_controles.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/controls-evidence"
            node tests/browser/aceite_rolagem.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/scroll-evidence"
          else
            PLAYWRIGHT_BROWSER=webkit node tests/browser/aceite_editorial.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/editorial-webkit-evidence"
            node tests/browser/aceite_contexto.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/context-evidence"
            PLAYWRIGHT_BROWSER=webkit node tests/browser/aceite_rolagem.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/scroll-webkit-evidence"
            PLAYWRIGHT_BROWSER=webkit node tests/browser/aceite_contexto.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/context-webkit-evidence"
            PLAYWRIGHT_BROWSER=webkit node tests/browser/aceite_controles.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/controls-webkit-evidence"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fan-journey-evidence-${{ matrix.suite }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/browser-evidence
            ${{ runner.temp }}/publication-rehearsal
            ${{ runner.temp }}/resilience-evidence
            ${{ runner.temp }}/driver-updates-evidence
            ${{ runner.temp }}/visual-evidence
            ${{ runner.temp }}/controls-evidence
            ${{ runner.temp }}/controls-webkit-evidence
            ${{ runner.temp }}/editorial-evidence
            ${{ runner.temp }}/editorial-webkit-evidence
            ${{ runner.temp }}/scroll-evidence
            ${{ runner.temp }}/weekend-evidence
            ${{ runner.temp }}/lawson-tyres-evidence
            ${{ runner.temp }}/context-evidence
            ${{ runner.temp }}/scroll-webkit-evidence
            ${{ runner.temp }}/context-webkit-evidence
            ${{ runner.temp }}/streamlit.log
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, browser, security, n8n-audit, research-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Pacote da release / Release package
        run: python exportar_dashboard.py --destino "$RUNNER_TEMP/pitwall-release/pitwall-dashboard"
      - name: Conferir ZIP da release / Verify release ZIP
        run: |
          python - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          package = Path(os.environ["RUNNER_TEMP"]) / "pitwall-release/pitwall-dashboard"
          archive = package.parent / "pitwall-dashboard.zip"
          expected = sorted((package / "ARQUIVOS_PUBLICACAO.txt").read_text().splitlines())
          with zipfile.ZipFile(archive) as zipped:
              assert sorted(zipped.namelist()) == expected
              for item in zipped.infolist():
                  assert stat.S_ISREG(item.external_attr >> 16)
                  with zipped.open(item) as member, (package / item.filename).open("rb") as original:
                      assert hashlib.file_digest(member, "sha256").digest() == hashlib.file_digest(original, "sha256").digest(), item.filename
          manifest = json.loads((package / "MANIFESTO.json").read_text())
          with archive.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          print(json.dumps({"zip_sha256": digest, "zip_bytes": archive.stat().st_size,
                            "members_verified": len(expected), "build": manifest["apresentacao_build_sha256"]}))
          PY
      - name: Notas PT e EN / PT and EN release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pitwall.publishing.releases publish --asset "$RUNNER_TEMP/pitwall-release/pitwall-dashboard.zip"
