name: Coleta automática / Automatic collection
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      recovery_attempt:
        description: 'Tentativa de recuperação / Recovery attempt (0–2)'
        type: string
        default: '0'
      parent_run:
        description: 'Execução anterior / Previous run'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/coletar-dados.yml'
      - 'operacao2026/cloud.py'
      - 'operacao2026/publication.py'
      - 'operacao2026/driver_archive.py'
      - 'operacao2026/post_qualifying.py'
      - 'operacao2026/forecast_policy.json'
      - 'operacao2026/readiness.py'
      - 'operacao2026/driver_circuit_reviews.json'
      - 'pitwall/data/driver_updates.py'
      - 'operacao2026/weekend.py'
      - 'operacao2026/weekend_projection.py'
      - 'operacao2026/weekend_reconciliation.py'
      - 'operacao2026/final_results.py'
      - 'operacao2026/eventos/*.json'
      - 'operacao2026/adjudicacoes/**'
permissions:
  contents: write
  actions: write
concurrency:
  group: pitwall-automatic-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'mbpaschoal/pitwall-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependências do produtor congelado / Frozen-producer dependencies
        run: python -m pip install -r requirements_modelo_v1.txt
      - name: Restaurar capturas e espera / Restore captures and cooldown
        uses: actions/cache/restore@v4
        with:
          path: data/operacao_2026/fins_de_semana
          key: pitwall-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pitwall-collection-v1-
      - name: Coletar serialmente / Collect serially
        id: data
        run: |
          python -B -m operacao2026.cloud collect --result "$RUNNER_TEMP/collection.json"
          python - "$RUNNER_TEMP/collection.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          with open(sys.argv[2],'a') as output:
              output.write('changed='+str(result['changed']).lower()+'\n')
              output.write('forecast_attempted='+str(result.get('forecast',{}).get('attempted_this_run',False)).lower()+'\n')
          PY
      - name: Limitar estado persistido / Bound persisted state
        id: storage
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          size=sum(p.stat().st_size for p in Path('data/operacao_2026/fins_de_semana').rglob('*') if p.is_file())
          if size>128*1024*1024:raise SystemExit('Collection state exceeds 128 MiB; preserve and review before increasing storage.')
          PY
      - name: Conferir acesso da fonte / Check provider access
        run: python -B -m operacao2026.github_maintenance check-source --result "$RUNNER_TEMP/collection.json"
      - name: Preservar capturas mesmo em falha / Preserve captures even on failure
        if: always() && steps.storage.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/operacao_2026/fins_de_semana
          key: pitwall-collection-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.data.outputs.changed == 'true'
        run: python -m pip install -r publicacao/templates/requirements.txt
      - name: Versionar alteração real / Version substantive change
        if: steps.data.outputs.changed == 'true'
        run: |
          python -B -m operacao2026.cloud prepare-release --result "$RUNNER_TEMP/collection.json"
          python -B exportar_dashboard.py --destino "$RUNNER_TEMP/generated/pitwall-dashboard"
          cp -a "$RUNNER_TEMP/generated/pitwall-dashboard/." distribuicao/pitwall-dashboard/
          python -B -m pitwall.publishing.releases check --base HEAD
      - name: Validar antes de publicar / Validate before publishing
        if: steps.data.outputs.changed == 'true'
        run: |
          python -B -m unittest tests.test_post_qualifying tests.test_driver_updates tests.test_automatic_publication tests.test_weekend_cloud tests.test_weekend_operation tests.test_weekend_reconciliation tests.test_final_results tests.test_weekend_official tests.test_weekend_ui tests.test_i18n tests.test_releases tests.test_dashboard_app tests.test_review_regressions tests.test_fan_exploration
          python -B verificar_pacote.py --pacote distribuicao/pitwall-dashboard
          diff -qr --exclude=__pycache__ "$RUNNER_TEMP/generated/pitwall-dashboard" distribuicao/pitwall-dashboard
      - uses: actions/setup-node@v6
        if: steps.data.outputs.changed == 'true'
        with:
          node-version: '22'
      - name: Conferir navegação / Check navigation
        if: steps.data.outputs.changed == 'true'
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          python -m streamlit run distribuicao/pitwall-dashboard/app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > "$RUNNER_TEMP/streamlit.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 1
          done
          node tests/browser/aceite_exploracao.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/browser-evidence"
          node tests/browser/aceite_pilotos_atualizacao.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/driver-updates-evidence"
          node tests/browser/aceite_visual.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/visual-evidence"
          node tests/browser/aceite_fim_semana.cjs http://127.0.0.1:8501 "$RUNNER_TEMP/weekend-evidence"
      - uses: actions/upload-artifact@v4
        if: always() && steps.data.outputs.changed == 'true'
        with:
          name: automatic-data-browser-evidence
          retention-days: 3
          path: |
            ${{ runner.temp }}/browser-evidence
            ${{ runner.temp }}/driver-updates-evidence
            ${{ runner.temp }}/visual-evidence
            ${{ runner.temp }}/weekend-evidence
            ${{ runner.temp }}/streamlit.log
      - name: Arquivar fontes originais / Archive original sources
        id: captures
        if: always() && steps.storage.outcome == 'success' && (steps.data.outputs.changed == 'true' || steps.data.outputs.forecast_attempted == 'true')
        run: |
          python - "$RUNNER_TEMP/capturas-originais.tar.gz" <<'PY'
          from pathlib import Path
          import sys
          from operacao2026.cloud import archive_captures
          from pitwall.paths import PROJECT_ROOT
          archive_captures(PROJECT_ROOT,Path(sys.argv[1]))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.captures.outcome == 'success'
        with:
          name: original-data-captures-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: ${{ runner.temp }}/capturas-originais.tar.gz
      - name: Publicar dados e release / Publish data and release
        id: publication
        if: steps.data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PITWALL_RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
          PITWALL_RUN_ID: ${{ github.run_id }}
        run: |
          python -B -m operacao2026.publication --result "$RUNNER_TEMP/collection.json" \
            --zip "$RUNNER_TEMP/generated/pitwall-dashboard.zip" \
            --captures "$RUNNER_TEMP/capturas-originais.tar.gz" \
            --recovery-attempt "$PITWALL_RECOVERY_ATTEMPT" --run-id "$PITWALL_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"
      - name: Conferir versão pública / Verify public deployment
        if: steps.publication.outputs.published == 'true'
        timeout-minutes: 10
        run: node tests/browser/verificar_publicacao.cjs "$(cat VERSION)" "$RUNNER_TEMP/collection.json" "$RUNNER_TEMP/public-deployment"
      - name: Evidências públicas / Public evidence
        if: always() && steps.publication.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: ${{ runner.temp }}/public-deployment
      - name: Registrar resultado / Record outcome
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/collection.json" ]; then cat "$RUNNER_TEMP/collection.json" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Conferir atualização de Pilotos / Check driver-analysis updates
        if: always() && steps.data.outcome == 'success'
        run: python -B -m operacao2026.driver_archive check
      - name: Conferir previsão admitida / Check admitted forecast
        if: always() && steps.data.outcome == 'success'
        run: python -B -m operacao2026.post_qualifying check --result "$RUNNER_TEMP/collection.json"
      - name: Antecipar referência de pista / Check upcoming circuit references
        if: always() && steps.data.outcome == 'success'
        run: python -B -m operacao2026.readiness --check-upcoming
