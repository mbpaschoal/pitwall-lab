[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
# Configuração documentada; Streamlit pode manter controles operacionais conforme o ambiente.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#D3071D"
backgroundColor = "#E8F3FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#061226"
font = "sans serif"
