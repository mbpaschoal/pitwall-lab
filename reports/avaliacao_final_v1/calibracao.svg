<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="titulo-calibracao descricao-calibracao" data-grafico="calibracao-confiabilidade" data-reliability-left="105" data-reliability-width="935" data-reliability-bottom="365" data-reliability-height="265"><title id="titulo-calibracao">Curva de confiabilidade e distribuição das faixas de probabilidade</title><desc id="descricao-calibracao">No painel superior, cada ponto usa a probabilidade média prevista da faixa no eixo x e a frequência observada no eixo y. A diagonal tracejada representa calibração ideal. No painel inferior, barras lado a lado mostram as contagens por faixa para modelo e constante.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.titulo{font-size:20px;font-weight:bold}.subtitulo{font-size:12px;fill:#475569}.grade{stroke:#cbd5e1;stroke-width:1}.eixo{stroke:#334155;stroke-width:1.25}.ideal{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5}.modelo{fill:#2563eb}.constante{fill:#f97316}.barra-modelo{fill:#93c5fd;stroke:#2563eb;stroke-width:1}.barra-constante{fill:#fdba74;stroke:#f97316;stroke-width:1}.rotulo{font-size:11px}.contagem{font-size:10px;font-weight:bold}.legenda{font-size:12px}</style><text x="105" y="34" class="titulo">Calibração descritiva (2025)</text><text x="105" y="56" class="subtitulo">Curva de confiabilidade: x = probabilidade média prevista na faixa; y = frequência observada. Faixas vazias não recebem ponto.</text><text x="105" y="84" font-size="15" font-weight="bold">Curva de confiabilidade</text><rect x="105" y="100" width="935" height="265" fill="#f8fafc" stroke="#cbd5e1"/><line class="grade" x1="105.0" y1="100" x2="105.0" y2="365"/><line class="grade" x1="105" y1="365.0" x2="1040" y2="365.0"/><text class="rotulo" x="105.0" y="384" text-anchor="middle">0.0</text><text class="rotulo" x="95" y="365.0" text-anchor="end" dominant-baseline="middle">0.0</text><line class="grade" x1="198.5" y1="100" x2="198.5" y2="